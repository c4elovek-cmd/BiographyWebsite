    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column; 
            justify-content: flex-start; 
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto; 
            position: relative;
            padding: 40px 20px 150px 20px; 
        }

        /* ----------------------------------------------------------- */
        /* ФОНОВЫЕ ЭЛЕМЕНТЫ (КРУГИ ДЛЯ ЭФФЕКТА СТЕКЛА) */
        /* ----------------------------------------------------------- */
        .orb-1, .orb-2 {
            position: fixed; 
            border-radius: 50%;
            filter: blur(50px);
            z-index: 0;
            opacity: 0.8;
            pointer-events: none; 
            transition: transform 10s ease-in-out; 
            will-change: transform;
        }

        .orb-1 {
            width: 320px;
            height: 320px;
            background: linear-gradient(135deg, #ffffff, #333333);
            top: 0; left: 0; 
        }

        .orb-2 {
            width: 380px;
            height: 380px;
            background: linear-gradient(135deg, #777777, #111111);
            top: 0; left: 0; 
        }

        .gradient-border-wrap {
            margin: auto 0;
            position: relative;
            border-radius: 32px;
            padding: 2px; 
            background: linear-gradient(135deg, #ffffff 0%, #111111 50%, #ffffff 100%);
            width: 100%;
            max-width: 420px;
            z-index: 2;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            animation: glassAppear 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .glass-card * {
            font-family: "Rubik Maze", system-ui, sans-serif;
        }

        /* ----------------------------------------------------------- */
        /* КАРТОЧКА В СТИЛЕ "ЖИДКОГО СТЕКЛА" */
        /* ----------------------------------------------------------- */
        .glass-card {
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(40px) saturate(180%); 
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-radius: 30px; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8),
                        inset 0 0 1px rgba(255, 255, 255, 0.1); 
            padding: 28px 25px 23px 25px; 
            width: 100%;
            height: 100%;
            text-align: center;
        }

        @keyframes glassAppear {
            from { opacity: 0; transform: scale(0.9) translateY(20px); filter: blur(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        .avatar-container { position: relative; width: 110px; height: 110px; margin: 0 auto 15px; }
        .avatar-container::before {
            content: ''; position: absolute; top: -4%; left: -4%; right: -4%; bottom: -4%;
            background: linear-gradient(45deg, #ffffff, #444444);
            border-radius: 50%; z-index: -1; filter: blur(12px); opacity: 0.6;
            transition: opacity 0.5s ease;
        }
        .avatar {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .avatar-container:hover .avatar { transform: scale(1.05); }
        .avatar-container:hover::before { opacity: 0.9; }

        h1 { font-size: 26px; font-weight: normal; margin-bottom: 2px; letter-spacing: 1px; text-shadow: 0 2px 10px rgba(255,255,255,0.3); }
        .username { font-size: 14px; color: #a3a3a3; font-weight: normal; margin-bottom: 15px; letter-spacing: 1px; }
        .bio { font-size: 14px; color: #d4d4d4; line-height: 1.6; margin-bottom: 25px; font-weight: normal; }

        .links-container { display: flex; flex-direction: column; gap: 12px; }
        .link-item {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            padding: 12px 18px; 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 18px; color: #ffffff; text-decoration: none; font-size: 15px; font-weight: normal;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); cursor: pointer;
        }
        .link-item:hover { 
            background: rgba(255, 255, 255, 0.15); 
            border-color: rgba(255, 255, 255, 0.4); 
            transform: translateY(-3px); 
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4); 
        }
        .icon { width: 22px; height: 22px; fill: currentColor; flex-shrink: 0; }

        .expand-container { display: flex; flex-direction: column; align-items: flex-start; margin-top: 18px; width: 100%; }
        .expand-btn { background: none; border: none; cursor: pointer; padding: 5px 0; display: flex; align-items: center; gap: 6px; outline: none; color: #9ca3af; font-size: 14px; font-weight: normal; transition: color 0.3s ease; }
        .expand-btn svg { width: 20px; height: 20px; fill: currentColor; transition: transform 0.3s ease; }
        .expand-btn:hover { color: #ffffff; }
        .expand-btn.active svg { transform: rotate(180deg); }
        .expand-content { display: none; align-items: center; margin-top: 10px; padding: 12px 16px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; color: #e5e5e5; font-size: 14px; width: 100%; text-align: left; }
        .expand-content.show { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .inline-icon { width: 18px; height: 18px; vertical-align: text-bottom; margin-right: 6px; filter: brightness(0) invert(1); opacity: 1; }
        
        .footer { margin-top: 25px; font-size: 10px; color: #71717a; letter-spacing: 2px; text-transform: uppercase; font-weight: normal;}

        /* ----------------------------------------------------------- */
        /* ЗНАЧКИ ВНУТРИ КАРТОЧКИ (СНИЗУ) */
        /* ----------------------------------------------------------- */
        .card-footer-icons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 15px; 
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05); 
        }
        
        .bottom-icon-link {
            color: #ffffff;
            opacity: 0.6; 
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .bottom-icon-link:hover {
            opacity: 1;
            transform: scale(1.1) translateY(-1px);
            filter: drop-shadow(0 3px 6px rgba(255,255,255,0.3));
        }

        .bottom-icon-svg {
            width: 24px; 
            height: 24px;
            fill: currentColor;
        }

        /* 🎵 ПЛЕЕР */
        .bottom-player-wrapper { 
            position: fixed; 
            bottom: 15px; left: 50%; 
            transform: translateX(-50%); 
            width: calc(100% - 40px); 
            max-width: 420px; 
            z-index: 999; 
        }

        .player-gradient-wrap {
            padding: 2px;
            border-radius: 26px;
            background: linear-gradient(135deg, #ffffff 0%, #111111 50%, #ffffff 100%);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9);
            animation: playerSlideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            animation-delay: 0.2s;
            opacity: 0;
            transform: translateY(100px);
        }

        .bottom-player { 
            width: 100%; 
            background: rgba(12, 12, 12, 0.6); 
            backdrop-filter: blur(40px); 
            -webkit-backdrop-filter: blur(40px); 
            border-radius: 24px; 
            padding: 12px 20px; 
            display: flex; align-items: center; justify-content: space-between; 
            position: relative; 
        }
        @keyframes playerSlideUp { to { transform: translateY(0); opacity: 1; } }
        
        .player-controls { display: flex; align-items: center; gap: 15px; width: 100%; }
        
        .play-pause-btn { background: #ffffff; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #000000; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); flex-shrink: 0; box-shadow: 0 4px 15px rgba(255,255,255,0.2);}
        .play-pause-btn:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(255,255,255,0.4); }
        .play-pause-btn svg { width: 18px; height: 18px; fill: currentColor; }

        .track-meta { display: flex; flex-direction: column; overflow: hidden; flex-grow: 1; max-width: calc(100% - 150px); } 
        
        /* ИСПРАВЛЕНИЕ: Добавлен шрифт Rubik Maze к тексту плеера */
        .track-name { font-family: "Rubik Maze", system-ui, sans-serif; font-size: 14px; font-weight: normal; color: #ffffff; letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 5px rgba(0,0,0,0.8);}
        .track-status { font-family: "Rubik Maze", system-ui, sans-serif; font-size: 11px; color: #a1a1aa; margin-top: 2px; font-weight: normal; letter-spacing: 1px;}

        /* СТИЛИ ПОЛЗУНКА ГРОМКОСТИ */
        .volume-control-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }
        
        .volume-control-wrap:hover { opacity: 1; }

        .volume-icon {
            width: 18px;
            height: 18px;
            color: #ffffff;
            flex-shrink: 0;
        }

        .volume-slider {
            -webkit-appearance: none;
            width: 70px; 
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
            opacity: 0; 
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .volume-control-wrap:hover .volume-slider {
            opacity: 1;
            width: 70px;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            background: #ffffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0,0,0,0.5);
            transition: transform 0.2s ease;
        }

        .volume-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
        .volume-slider::-webkit-slider-thumb:active { transform: scale(1.1); background: #aaaaaa; }

        .playlist-toggle-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; cursor: pointer; color: #fff; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; padding: 8px; }
        .playlist-toggle-btn:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.05); border-color: rgba(255,255,255,0.3);}
        .playlist-toggle-btn svg { width: 20px; height: 20px; fill: currentColor; }

        .equalizer { display: flex; align-items: flex-end; gap: 3px; width: 18px; height: 16px; flex-shrink: 0; margin-left: 5px;}
        .eq-bar { width: 4px; height: 100%; background: #ffffff; transform-origin: bottom; animation: bounce 0.5s ease-in-out infinite alternate; animation-play-state: paused; border-radius: 2px; box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);}
        .equalizer.playing .eq-bar { animation-play-state: running; }
        .eq-bar:nth-child(1) { animation-duration: 0.4s; } .eq-bar:nth-child(2) { animation-duration: 0.7s; background: #aaaaaa; box-shadow: 0 0 8px rgba(170, 170, 170, 0.5);} .eq-bar:nth-child(3) { animation-duration: 0.5s; }
        @keyframes bounce { 0% { transform: scaleY(0.15); } 100% { transform: scaleY(1); } }

        .playlist-menu { position: absolute; bottom: 85px; left: 0; width: 100%; max-height: 280px; background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px); border: 1px solid rgba(255, 255, 255, 0.15); border-top: 1px solid rgba(255, 255, 255, 0.3); border-radius: 20px; overflow-y: auto; display: none; flex-direction: column; padding: 8px 0; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9); z-index: 1000; }
        .playlist-menu.show { display: flex; animation: menuFadeIn 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); }
        @keyframes menuFadeIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        
        /* ИСПРАВЛЕНИЕ: Добавлен шрифт Rubik Maze к трекам в меню плейлиста */
        .playlist-item { font-family: "Rubik Maze", system-ui, sans-serif; padding: 14px 20px; font-size: 14px; color: #a1a1aa; cursor: pointer; transition: all 0.2s ease; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; min-height: 44px; line-height: 1.2;}
        .playlist-item:last-child { border-bottom: none; }
        .playlist-item:hover { background: rgba(255, 255, 255, 0.1); color: #fff; padding-left: 25px;}
        .playlist-item.active { color: #fff; font-weight: normal; background: rgba(255, 255, 255, 0.08); border-left: 4px solid #ffffff; padding-left: 20px;}

        .playlist-menu::-webkit-scrollbar { width: 5px; }
        .playlist-menu::-webkit-scrollbar-track { background: transparent; margin: 10px 0;}
        .playlist-menu::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.25); border-radius: 10px; }
    </style>
</head>

    <!-- 🎵 ПЛЕЕР -->
    <div class="bottom-player-wrapper">
        <audio id="bg-music" src="" loop></audio>

        <div id="playlist-menu" class="playlist-menu">
            <div style="text-align:center; padding: 10px; color:#a1a1aa; font-size:13px;">Загрузка треков...</div>
        </div>

        <div class="player-gradient-wrap">
            <div class="bottom-player">
                <div class="player-controls">
                    <button id="play-btn" class="play-pause-btn" title="Play">
                        <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="icon-pause" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    
                    <div class="track-meta">
                        <span id="track-name" class="track-name">Ожидание...</span>
                        <span id="player-status" class="track-status">Кликните плей</span>
                    </div>

                    <div class="volume-control-wrap">
                        <svg class="volume-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.08"/></svg>
                        <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="0.7">
                    </div>

                    <button id="toggle-playlist-btn" class="playlist-toggle-btn" title="Показать весь плейлист">
                        <svg viewBox="0 0 24 24"><path d="M3 18h12v-2H3v2zM3 6v2h18V6H3zm0 7h18v-2H3v2z"/></svg>
                    </button>

                    <div id="eq" class="equalizer">
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function moveOrbs() {
            const orb1 = document.getElementById('orb1');
            const orb2 = document.getElementById('orb2');
            const maxX = window.innerWidth;
            const maxY = window.innerHeight;
            const randomX1 = Math.floor(Math.random() * maxX) - 150; 
            const randomY1 = Math.floor(Math.random() * maxY) - 150;
            const randomX2 = Math.floor(Math.random() * maxX) - 150;
            const randomY2 = Math.floor(Math.random() * maxY) - 150;
            orb1.style.transform = `translate(${randomX1}px, ${randomY1}px) scale(${Math.random() * 0.5 + 0.8})`;
            orb2.style.transform = `translate(${randomX2}px, ${randomY2}px) scale(${Math.random() * 0.5 + 0.8})`;
        }
        setTimeout(moveOrbs, 100); 
        setInterval(moveOrbs, 10000);

        const expandBtn = document.getElementById('expand-btn');
        const expandContent = document.getElementById('expand-content');
        expandBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            expandBtn.classList.toggle('active');
            expandContent.classList.toggle('show');
        });

        const discordBtn = document.getElementById('discord-btn');
        const discordText = document.getElementById('discord-text');
        discordBtn.addEventListener('click', (e) => {
            e.preventDefault();
            navigator.clipboard.writeText('_c4elovek_').then(() => {
                const originalText = discordText.innerText;
                discordText.innerText = 'Скопировано!';
                setTimeout(() => { discordText.innerText = originalText; }, 2000);
            }).catch(err => console.error('Ошибка копирования: ', err));
        });

        // ИСПРАВЛЕНИЕ: Добавлен твой полный блэклист
        const BLACKLIST = [
            "Странный",
            "Её парень",
            "Священная война",
            "Плёнка",
            "грустинка",
            "xsonsss",
            "overdose",
            "ммм",
            "недотрога",
            "Chance",
            "фп",
            "флаг",
            "тинкер",
            "клановая",
            "ослепительна",
            "madk1d",
            "гимн",
            "Катюха",
            "попал",
            "MORGENSHTERN",
            "потеря"
        ];

        const audio = document.getElementById('bg-music');
        const playBtn = document.getElementById('play-btn');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const statusText = document.getElementById('player-status');
        const trackNameEl = document.getElementById('track-name');
        const eq = document.getElementById('eq');
        const playlistMenu = document.getElementById('playlist-menu');
        const togglePlaylistBtn = document.getElementById('toggle-playlist-btn');
        const volumeSlider = document.getElementById('volume-slider');

        let playlist = [];
        let currentTrackIndex = 0;

        fetch('playlist.json', { cache: 'no-store' })
            .then(response => { 
                if (!response.ok) { 
                    throw new Error(`HTTP error! status: ${response.status}`); 
                } 
                return response.json(); 
            })
            .then(data => {
                playlist = data.filter(item => {
                    let fileName = typeof item === 'string' ? item : item.file;
                    const nameLower = fileName.toLowerCase();
                    return !BLACKLIST.some(badWord => nameLower.includes(badWord.toLowerCase()));
                });

                if(playlist.length > 0) { 
                    buildPlaylistMenu(); 
                    loadTrack(0, false); 
                } else { 
                    trackNameEl.innerText = "Плейлист пуст"; 
                    playlistMenu.innerHTML = '<div style="text-align:center; padding:15px; color:#a1a1aa;">Нет доступных треков</div>'; 
                }
            })
            .catch(err => { 
                trackNameEl.innerText = "Смотри лог"; 
                playlistMenu.innerHTML = `<div style="text-align:left; padding:15px; color:#ef4444; font-family: monospace; font-size: 12px; line-height: 1.4; word-wrap: break-word;">
                    <b>🚨 ОШИБКА ЗАГРУЗКИ:</b><br>${err.name}: ${err.message}<br><br><b>ДЕТАЛИ:</b><br>${err.stack}
                </div>`; 
            });

        function buildPlaylistMenu() {
            playlistMenu.innerHTML = ''; 
            playlist.forEach((item, index) => {
                let fileName = typeof item === 'string' ? item : item.file;
                let cleanName = fileName.replace('.mp3', '').replace(/_/g, ' '); 
                let el = document.createElement('div');
                el.className = 'playlist-item';
                el.innerText = `${index + 1}. ${cleanName}`; 
                el.onclick = (e) => { e.stopPropagation(); loadTrack(index, true); playlistMenu.classList.remove('show'); };
                playlistMenu.appendChild(el);
            });
        }

	function loadTrack(index, autoPlay = true) {
	    currentTrackIndex = index;
	    let item = playlist[index];
	    let file = typeof item === 'string' ? item : item.file;
	    let cleanName = file.replace('.mp3', '').replace(/_/g, ' ');
	    
	    document.querySelectorAll('.playlist-item').forEach((el, i) => { 
	        if(i === index) el.classList.add('active'); 
	        else el.classList.remove('active'); 
	    });
	    
	    const fileUrl = 'music/' + encodeURIComponent(file);
	    audio.src = fileUrl;
	    trackNameEl.innerText = cleanName;

	    // Чтение вшитой обложки прямо из MP3
	    if (window.jsmediatags) {
	        window.jsmediatags.read(fileUrl, {
	            onSuccess: function(tag) {
	                let artworkArray = [{ src: 'avatar.png', sizes: '512x512', type: 'image/png' }];
	                
	                if (tag.tags.picture) {
	                    const data = tag.tags.picture.data;
	                    const format = tag.tags.picture.format;
	                    const byteArray = new Uint8Array(data);
	                    const blob = new Blob([byteArray], { type: format });
	                    const imageUrl = URL.createObjectURL(blob);
	                    
	                    artworkArray = [{ src: imageUrl, sizes: '512x512', type: format }];
	                }
	                
	                updateMediaSession(cleanName, artworkArray);
	            },
	            onError: function() {
	                updateMediaSession(cleanName, [{ src: 'avatar.png', sizes: '512x512', type: 'image/png' }]);
	            }
	        });
	    } else {
	        updateMediaSession(cleanName, [{ src: 'avatar.png', sizes: '512x512', type: 'image/png' }]);
	    }
	    
	    if(autoPlay) { togglePlay(true); }
	}

	function updateMediaSession(title, artwork) {
	    if ('mediaSession' in navigator) {
	        navigator.mediaSession.metadata = new MediaMetadata({
	            title: title, 
	            artist: 'c4elovek.online', 
	            album: 'Избранный плейлист',
	            artwork: artwork
	        });
	        navigator.mediaSession.setActionHandler('play', () => togglePlay(true));
	        navigator.mediaSession.setActionHandler('pause', () => togglePlay(false));
	        navigator.mediaSession.setActionHandler('previoustrack', playPrevTrack);
	        navigator.mediaSession.setActionHandler('nexttrack', playNextTrack);
	    }
	}
      

        function playNextTrack() {
            if (playlist.length === 0) return;
            currentTrackIndex++;
            if (currentTrackIndex >= playlist.length) { currentTrackIndex = 0; }
            loadTrack(currentTrackIndex, true);
        }

        function playPrevTrack() {
            if (playlist.length === 0) return;
            currentTrackIndex--;
            if (currentTrackIndex < 0) { currentTrackIndex = playlist.length - 1; }
            loadTrack(currentTrackIndex, true);
        }

        togglePlaylistBtn.addEventListener('click', (e) => { e.stopPropagation(); playlistMenu.classList.toggle('show'); });

        let hasStartedPlaying = false;
        
        window.addEventListener('click', (e) => {
            if (!playlistMenu.contains(e.target) && !togglePlaylistBtn.contains(e.target)) { playlistMenu.classList.remove('show'); }
            if (!expandContent.contains(e.target) && !expandBtn.contains(e.target)) { expandContent.classList.remove('show'); expandBtn.classList.remove('active'); }
            if (!hasStartedPlaying && audio.paused && playlist.length > 0 && e.target !== volumeSlider) { togglePlay(true); hasStartedPlaying = true; }
        });

        function togglePlay(forcePlay = false) {
            if (playlist.length === 0) return;
            
            const shouldPlay = typeof forcePlay === 'boolean' && forcePlay.isTrusted === undefined ? forcePlay : audio.paused;

            if (shouldPlay) {
                audio.play().then(() => {
                    iconPlay.style.display = 'none'; iconPause.style.display = 'block';
                    statusText.innerText = 'сейчас играет'; eq.classList.add('playing');
                }).catch(err => { console.log("Автозапуск заблокирован."); iconPlay.style.display = 'block'; iconPause.style.display = 'none'; });
            } else {
                audio.pause(); iconPlay.style.display = 'block'; iconPause.style.display = 'none';
                statusText.innerText = 'на паузе'; eq.classList.remove('playing');
            }
        }

        playBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); hasStartedPlaying = true; });
        audio.addEventListener('ended', playNextTrack);

        audio.volume = volumeSlider.value;
        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

    </script>
