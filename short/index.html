<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Сокращатель ссылок | c4elovek</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Maze&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000000; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; position: relative; padding: 40px 20px; justify-content: center;}

        /* Убрали плавность отсюда, ей полностью управляет скрипт */
        .orb-1, .orb-2 { position: fixed; border-radius: 50%; filter: blur(50px); z-index: 0; opacity: 0.8; pointer-events: none; }
        .orb-1 { width: 320px; height: 320px; background: linear-gradient(135deg, #ffffff, #333333); top: 0; left: 0; }
        .orb-2 { width: 380px; height: 380px; background: linear-gradient(135deg, #777777, #111111); top: 0; left: 0; }

        .gradient-border-wrap { margin: auto; position: relative; border-radius: 32px; padding: 2px; background: linear-gradient(135deg, #ffffff 0%, #111111 50%, #ffffff 100%); width: 100%; max-width: 420px; z-index: 2; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(40px); border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.08); padding: 35px 25px; width: 100%; text-align: center; }
        
        h1 { font-family: "Rubik Maze", system-ui, sans-serif; font-size: 26px; font-weight: normal; margin-bottom: 5px; }
        .subtitle { font-size: 14px; color: #a3a3a3; margin-bottom: 25px; }

        .input-group { margin-bottom: 20px; text-align: left; }
        
        input[type="url"], input[type="password"], input[type="number"], select { 
            width: 100%; padding: 14px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.15); 
            background: rgba(0,0,0,0.5); color: #fff; outline: none; font-size: 15px; margin-bottom: 10px; transition: 0.3s;
        }
        input:focus, select:focus { border-color: #ffffff; }
        select { appearance: none; -webkit-appearance: none; cursor: pointer; }
        select option { background: #111; color: #fff; }

        .checkbox-wrap { display: flex; align-items: center; gap: 10px; margin-left: 5px; cursor: pointer; margin-bottom: 10px; }
        .checkbox-wrap input { width: 18px; height: 18px; cursor: pointer; accent-color: #ffffff; flex-shrink: 0; }
        .checkbox-wrap span { font-size: 13px; color: #d4d4d4; }

        .btn { width: 100%; padding: 15px; border-radius: 16px; border: none; background: #ffffff; color: #000000; cursor: pointer; font-size: 15px; font-weight: bold; margin-top: 5px; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }

        .result-box { margin-top: 25px; padding: 15px; border-radius: 16px; background: rgba(0, 255, 0, 0.1); border: 1px solid rgba(0, 255, 0, 0.3); display: none; word-break: break-all; text-align: left;}
        .result-box.error { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); }
        .result-link { color: #00ff00; font-size: 16px; font-weight: bold; text-decoration: none; display: block; margin-bottom: 15px; }
        .result-box.error .result-link { color: #ef4444; font-size: 14px; font-weight: normal; }
        
        .copy-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 8px 15px; border-radius: 10px; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .back-link { display: inline-block; margin-top: 30px; color: #9ca3af; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="orb-1" id="orb1"></div>
    <div class="orb-2" id="orb2"></div>

    <div class="gradient-border-wrap">
        <div class="glass-card">
            <h1>Secure Link</h1>
            <div class="subtitle">Создание защищенных ссылок</div>

            <div class="input-group">
                <input type="url" id="long-url" placeholder="Вставь оригинальный URL...">
                <input type="number" id="link-length" placeholder="Длина ссылки (от 3 до 50, по ум. 12)" min="3" max="50">
                <input type="password" id="link-password" placeholder="Пароль (если нужен)">
                <select id="link-expire">
                    <option value="">Без срока (бессмертная)</option>
                    <option value="3600">Сгорит через 1 час</option>
                    <option value="86400">Сгорит через 24 часа</option>
                    <option value="604800">Сгорит через 7 дней</option>
                </select>
                
                <label class="checkbox-wrap">
                    <input type="checkbox" id="link-special">
                    <span>Использовать спецсимволы (!, @, *, ~ и др.)</span>
                </label>
                <label class="checkbox-wrap">
                    <input type="checkbox" id="link-onetime">
                    <span>Одноразовая (удалится после 1 перехода)</span>
                </label>
            </div>

            <button class="btn" id="shorten-btn">Создать ссылку</button>

            <div class="result-box" id="result-box">
                <a href="#" target="_blank" class="result-link" id="result-link"></a>
                <button class="copy-btn" id="copy-btn">Копировать</button>
            </div>

            <a href="/" class="back-link">← На главную</a>
        </div>
    </div>

    <script>
        const orb1 = document.getElementById('orb1');
        const orb2 = document.getElementById('orb2');

        function moveOrbs() {
            orb1.style.transition = 'transform 10s ease-in-out';
            orb2.style.transition = 'transform 10s ease-in-out';
            orb1.style.transform = `translate(${Math.floor(Math.random() * window.innerWidth) - 150}px, ${Math.floor(Math.random() * window.innerHeight) - 150}px) scale(${Math.random() * 0.5 + 0.8})`;
            orb2.style.transform = `translate(${Math.floor(Math.random() * window.innerWidth) - 150}px, ${Math.floor(Math.random() * window.innerHeight) - 150}px) scale(${Math.random() * 0.5 + 0.8})`;
        }

        // Читаем точные координаты из памяти
        const saved1 = sessionStorage.getItem('orb1_matrix');
        const saved2 = sessionStorage.getItem('orb2_matrix');

        if (saved1 && saved2 && saved1 !== 'none') {
            // Мгновенно ставим круги на прошлую позицию без анимации
            orb1.style.transition = 'none';
            orb2.style.transition = 'none';
            orb1.style.transform = saved1;
            orb2.style.transform = saved2;
            
            // Ждем пока браузер отрендерит кадр, и запускаем полет дальше
            requestAnimationFrame(() => {
                requestAnimationFrame(() => moveOrbs());
            });
        } else {
            moveOrbs();
        }

        setInterval(moveOrbs, 10000);

        // Функция сохранения точных координат "в полете"
        function saveOrbsPos() {
            const style1 = window.getComputedStyle(orb1).transform;
            const style2 = window.getComputedStyle(orb2).transform;
            if(style1 !== 'none') sessionStorage.setItem('orb1_matrix', style1);
            if(style2 !== 'none') sessionStorage.setItem('orb2_matrix', style2);
        }

        // Сохраняем при обновлении страницы на ПК
        window.addEventListener('beforeunload', saveOrbsPos);
        // Сохраняем при сворачивании браузера на телефоне
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') saveOrbsPos();
        });


        // --- Логика сокращателя ---
        const btn = document.getElementById('shorten-btn');
        const urlInput = document.getElementById('long-url');
        const lengthInput = document.getElementById('link-length');
        const pwdInput = document.getElementById('link-password');
        const expireSelect = document.getElementById('link-expire');
        const specialCheck = document.getElementById('link-special');
        const oneTimeCheck = document.getElementById('link-onetime');
        const resultBox = document.getElementById('result-box');
        const resultLink = document.getElementById('result-link');
        const copyBtn = document.getElementById('copy-btn');
        let currentShortUrl = "";

        btn.addEventListener('click', async () => {
            const url = urlInput.value.trim();
            resultBox.style.display = 'block';
            resultBox.classList.remove('error');
            copyBtn.style.display = 'none';

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                resultBox.classList.add('error');
                resultLink.innerText = 'URL должен начинаться с http:// или https://';
                resultLink.removeAttribute('href');
                return;
            }

            btn.innerText = 'Создание...';
            btn.disabled = true;
            
            try {
                const response = await fetch('/api/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        targetUrl: url,
                        password: pwdInput.value.trim(),
                        expireTtl: expireSelect.value,
                        isOneTime: oneTimeCheck.checked,
                        customLength: lengthInput.value,
                        useSpecialChars: specialCheck.checked
                    })
                });
                
                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(errText || 'Ошибка сервера');
                }
                const data = await response.json();
                if(data.error) throw new Error(data.error);

                currentShortUrl = data.shortUrl;
                resultLink.innerText = currentShortUrl;
                resultLink.href = currentShortUrl;
                copyBtn.style.display = 'inline-block';
                
                urlInput.value = ''; pwdInput.value = ''; lengthInput.value = '';
                expireSelect.value = ''; oneTimeCheck.checked = false; specialCheck.checked = false;
            } catch (e) {
                resultBox.classList.add('error');
                let errorMsg = 'Ошибка соединения с сервером.';
                try {
                    const parsedErr = JSON.parse(e.message);
                    if(parsedErr.error) errorMsg = parsedErr.error;
                } catch(err) {
                    if (e.message !== 'Ошибка сервера') errorMsg = e.message;
                }
                resultLink.innerText = errorMsg;
                resultLink.removeAttribute('href');
            }
            btn.innerText = 'Создать ссылку';
            btn.disabled = false;
        });

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(currentShortUrl).then(() => {
                copyBtn.innerText = "Скопировано!";
                setTimeout(() => { copyBtn.innerText = "Копировать"; }, 2000);
            });
        });
    </script>
</body>
</html>
